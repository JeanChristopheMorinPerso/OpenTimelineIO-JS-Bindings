name: lint

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  cpp:
    name: cpp
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: jidicula/clang-format-action@v4.18.0
        name: clang-format
        with:
          clang-format-version: "15"
          check-path: "src"

  js:
    name: js
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@v3.1.2
        name: Install pnpm and Node.js
        with:
          runtime: node@20
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - run: pnpm exec eslint .
        name: ESLint

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Upload zizmor findings to GitHub code scanning.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@v0.8.1
        name: Audit GitHub Actions
        with:
          persona: auditor
          advanced-security: true
